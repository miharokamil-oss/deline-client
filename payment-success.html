<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Оплата успешна - Zenex Client</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Rajdhani', sans-serif;
      background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 100%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .success-container {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 60px 40px;
      max-width: 600px;
      width: 100%;
      text-align: center;
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    .success-icon {
      width: 100px;
      height: 100px;
      margin: 0 auto 30px;
      background: linear-gradient(135deg, rgba(34, 197, 94, 0.2), rgba(34, 197, 94, 0.3));
      border: 2px solid rgba(34, 197, 94, 0.5);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 50px;
      color: #22C55E;
      animation: scaleIn 0.5s ease;
    }

    @keyframes scaleIn {
      from { transform: scale(0); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 32px;
      margin-bottom: 16px;
      color: #22C55E;
    }

    .order-info {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 24px;
      margin: 30px 0;
      text-align: left;
    }

    .order-row {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .order-row:last-child {
      border-bottom: none;
    }

    .order-label {
      color: rgba(255, 255, 255, 0.5);
      font-size: 14px;
    }

    .order-value {
      color: rgba(255, 255, 255, 0.9);
      font-weight: 600;
      font-size: 16px;
    }

    .message {
      color: rgba(255, 255, 255, 0.7);
      line-height: 1.6;
      margin-bottom: 30px;
      font-size: 16px;
    }

    .btn-home {
      background: linear-gradient(135deg, rgba(120,120,140,0.3) 0%, rgba(80,80,100,0.7) 100%);
      border: 1px solid rgba(180,180,200,0.25);
      border-radius: 12px;
      color: #fff;
      padding: 16px 48px;
      font-size: 16px;
      font-weight: 700;
      font-family: 'Rajdhani', sans-serif;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: all 0.3s;
      margin-top: 10px;
    }

    .btn-home:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      border-color: rgba(200,200,220,0.4);
    }

    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-top-color: #22C55E;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .error-icon {
      background: linear-gradient(135deg, rgba(239, 68, 68, 0.2), rgba(239, 68, 68, 0.3));
      border-color: rgba(239, 68, 68, 0.5);
      color: #EF4444;
    }

    .error-title {
      color: #EF4444;
    }
  </style>
</head>
<body>
  <div class="success-container" id="content">
    <div class="loading">
      <div class="spinner"></div>
      <p class="message">Проверяем статус платежа...</p>
    </div>
  </div>

  <script src="./config.js"></script>

  <script>
    const BACKEND_URL = CONFIG.BACKEND_URL;

    async function checkPaymentStatus() {
      try {
        // Получаем информацию о заказе из localStorage
        const pendingOrder = JSON.parse(localStorage.getItem('pendingOrder') || 'null');
        
        if (!pendingOrder || !pendingOrder.orderId) {
          showError('Заказ не найден');
          return;
        }

        // Проверяем статус заказа
        const response = await fetch(`${BACKEND_URL}/api/payment/status/${pendingOrder.orderId}`);
        const data = await response.json();

        if (data.success && data.order) {
          if (data.order.status === 'completed') {
            showSuccess(data.order);
            localStorage.removeItem('pendingOrder');
          } else if (data.order.status === 'pending') {
            // Платеж еще обрабатывается
            setTimeout(checkPaymentStatus, 2000);
          } else {
            showError('Платеж не был завершен');
          }
        } else {
          showError('Не удалось проверить статус заказа');
        }

      } catch (error) {
        console.error('Error checking payment:', error);
        showError('Ошибка при проверке платежа');
      }
    }

    function showSuccess(order) {
      const content = document.getElementById('content');
      content.innerHTML = `
        <div class="success-icon">
          <i class="fas fa-check"></i>
        </div>
        <h1>Оплата успешна!</h1>
        <p class="message">Спасибо за покупку! Ваш заказ успешно оплачен.</p>
        
        <div class="order-info">
          <div class="order-row">
            <span class="order-label">Номер заказа</span>
            <span class="order-value">${order.orderId}</span>
          </div>
          <div class="order-row">
            <span class="order-label">Товар</span>
            <span class="order-value">${order.productName}</span>
          </div>
          <div class="order-row">
            <span class="order-label">Сумма</span>
            <span class="order-value">${order.amount} ₽</span>
          </div>
          <div class="order-row">
            <span class="order-label">Статус</span>
            <span class="order-value" style="color: #22C55E;">Оплачено</span>
          </div>
        </div>

        <p class="message">
          Товар будет активирован в вашем профиле в течение нескольких минут.
        </p>

        <a href="profile.html" class="btn-home">
          <i class="fas fa-user"></i> Перейти в профиль
        </a>
        <br>
        <a href="index.html" class="btn-home" style="margin-top: 10px;">
          <i class="fas fa-home"></i> На главную
        </a>
      `;
    }

    function showError(message) {
      const content = document.getElementById('content');
      content.innerHTML = `
        <div class="success-icon error-icon">
          <i class="fas fa-times"></i>
        </div>
        <h1 class="error-title">Ошибка оплаты</h1>
        <p class="message">${message}</p>
        
        <a href="shop.html" class="btn-home">
          <i class="fas fa-shopping-cart"></i> Вернуться в магазин
        </a>
      `;
    }

    // Запускаем проверку при загрузке страницы
    checkPaymentStatus();
  </script>
</body>
</html>
