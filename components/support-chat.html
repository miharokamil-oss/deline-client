<!-- Кнопка чата -->
<div class="chat-button" id="chatButton">
  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" />
  </svg>
</div>

<!-- Окно чата -->
<div class="chat-window" id="chatWindow">
  <!-- Заголовок -->
  <div class="chat-header">
    <div class="chat-header-left">
      <button class="chat-header-back" id="chatBackBtn">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
      </button>
      <div>
        <div class="chat-header-title" id="chatTitle">Поддержка Zenex</div>
        <div class="chat-header-subtitle" id="chatSubtitle">Обычно отвечаем в течение минуты</div>
      </div>
    </div>
    <button class="chat-close" id="chatCloseBtn">×</button>
  </div>

  <!-- Список клиентов (для модераторов) -->
  <div class="chat-clients hidden" id="chatClients">
    <!-- Клиенты будут добавляться динамически -->
  </div>

  <!-- Сообщения -->
  <div class="chat-messages" id="chatMessages">
    <!-- Сообщения будут добавляться динамически -->
  </div>

  <!-- Ввод сообщения -->
  <div class="chat-input-wrapper" id="chatInputWrapper">
    <button class="chat-close-ticket-btn hidden" id="chatCloseTicketBtn">
      Закрыть обращение
    </button>
    <div class="chat-user-actions hidden" id="chatUserActions">
      <button class="chat-action-btn call-moderator" id="callModeratorBtn">
        Позвать модератора
      </button>
      <button class="chat-action-btn close-ticket" id="userCloseTicketBtn">
        Закрыть обращение
      </button>
    </div>
    <form class="chat-input-form" id="chatForm">
      <textarea 
        class="chat-input" 
        id="chatInput" 
        placeholder="Введите сообщение..."
        autocomplete="off"
        rows="1"
      ></textarea>
      <label class="chat-attachment-btn" for="chatAttachment" title="Прикрепить файл">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/>
        </svg>
      </label>
      <input type="file" id="chatAttachment" style="display:none;" accept="image/*,.pdf,.doc,.docx,.txt">
      <button type="submit" class="chat-send-btn" id="chatSendBtn">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
        </svg>
      </button>
    </form>
  </div>
</div>
